---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fb-deploy
  labels:
    app: facebook
    version: v2-vc
    tier: frontend
    env: prod

spec:
  replicas: 2

  selector:
    matchLabels:
      app: facebook
      version: v2-vc
      tier: frontend
      env: prod

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: facebook
        version: v2-vc
        env: prod
        tier: frontend

    spec:
      containers:
        - name: fb-cont
          image: devopshubg333/batch16d:pythonimg
          ports:
            - containerPort: 8080
