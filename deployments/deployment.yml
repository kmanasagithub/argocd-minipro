
---
apiVersion: apps/v1 
kind: Deployment
metadata:
  name: fb-deploy
  labels:
    app: facebook
    version: v1_AC
    tier: frontend
    env: prod 
spec:
  replicas: 2
  selectors:
    matchLabels:
      app: facebook 
      version: v1_AC 
      tier: frontend
      env: prod 
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  templates:
    metadata:
      name: fb-pod 
      labels:
        app: facebook 
        version: v1_AC
        env: prod
        tier: frontend
    spec:
      containers:
        - name: fb-cont 
          image: sravani2310/mcapp:latest
          ports:
          - containerPort: 8080
